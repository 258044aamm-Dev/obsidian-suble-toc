<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Subtle TOC — settings collapse probe</title>
		<link rel="stylesheet" href="./styles.css" />
		<style>
			:root {
				--background-modifier-hover: rgba(255, 255, 255, 0.075);
				--background-secondary: #262626;
				--background-modifier-border: #333;
				--interactive-accent: #7c6cde;
				--text-muted: #999;
				--font-medium: 500;
				--radius-s: 4px;
			}
			body {
				margin: 0;
				padding: 24px;
				background: #1e1e1e;
				color: #dadada;
				font-family: sans-serif;
				font-size: 14px;
			}
			/* ---------------------------------------------------------------
			   Fixtures for Obsidian's own settings row.

			   These are NOT invented. An earlier version of this file declared
			   `.setting-item { display: flex }` as a convenience, which quietly
			   made it impossible for the suite to ever observe a stacked row --
			   and a stacked row was exactly the bug that reached the user. The
			   assumption had been encoded as a test fixture.

			   Derived from a device screenshot (Android phone, Obsidian 1.13,
			   2026-10-03): on mobile a settings row stacks name over control,
			   flush left, unless it carries a control modifier class. This is an
			   approximation of Obsidian's stylesheet, good enough to make the
			   stacking case testable; the device checklist stays the authority.
			   --------------------------------------------------------------- */
			.setting-item {
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 12px 0;
				border-top: 1px solid var(--background-modifier-border);
			}
			.setting-item-info {
				margin-right: auto;
			}
			.setting-item-control {
				display: flex;
				align-items: center;
				justify-content: flex-end;
			}

			/* The mobile fixture. A row with no control modifier stacks. */
			body.is-mobile .setting-item {
				flex-direction: column;
				align-items: flex-start;
				gap: 8px;
				padding: 16px;
			}
			body.is-mobile .setting-item-control {
				width: 100%;
				justify-content: flex-start;
			}
			/* Mobile controls are full touch targets, which is where the tall
			   band of dead space in the screenshot came from. */
			body.is-mobile .clickable-icon {
				min-height: 44px;
			}
			/* ---------------------------------------------------------------
			   Host fixtures: the layouts Obsidian can put a settings row
			   inside. These are deliberately hostile -- the row in them is
			   given no layout of its own (below), because after 0.7.0-0.7.3
			   the plugin's row must not depend on one. A row that only works
			   inside a flex row parent is the bug this suite exists to catch.
			   --------------------------------------------------------------- */
			.subtle-toc-settings-host {
				width: 100%;
			}
			.subtle-toc-settings-host.is-block {
				display: block;
			}
			.subtle-toc-settings-host.is-rowflex {
				display: flex;
				flex-direction: row;
				align-items: center;
				justify-content: space-between;
				gap: 8px;
			}
			.subtle-toc-settings-host.is-columnflex {
				display: flex;
				flex-direction: column;
				align-items: flex-start;
				gap: 8px;
			}
			/* Core's own row LAYOUT is deliberately NOT modelled for a host
			   row: no display, no direction, no alignment. Whatever the plugin
			   row does inside this, it does on its own. Its spacing is kept,
			   though -- in the app a `.setting-item` is always padded by core,
			   and stripping that too would have the fixture measuring a row
			   the plugin will never actually be handed. */
			.setting-item.is-host,
			body.is-mobile .setting-item.is-host {
				display: block;
				gap: 0;
			}
			/* A row the framework stacks: name on top, control beneath, flush
			   left. Stands in for core's own stacked row so the control row
			   stacks under either fixture, not only under is-mobile. */
			.setting-item.is-stacked,
			body.is-mobile .setting-item.is-stacked {
				flex-direction: column;
				align-items: flex-start;
				gap: 8px;
			}

			.clickable-icon {
				padding: 4px 8px;
				color: var(--text-muted);
				cursor: pointer;
			}
			.clickable-icon::after {
				content: attr(data-icon);
				font-size: 11px;
			}
		</style>
	</head>
	<body>
		<div id="settings"></div>
		<script src="./settings-probe.js"></script>
	</body>
</html>
